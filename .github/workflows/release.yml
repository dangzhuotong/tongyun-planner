name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apps:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x64'
          - platform: 'macos-latest'
            os: 'macos'
            arch: 'universal'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            os: 'linux'
            arch: 'x64'
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'TongYun Planner v__VERSION__' || '' }}
          # 非 tag 触发时 tagName/releaseName 为空，tauri-action 只构建不建 Release，releaseBody 会被忽略
          releaseBody: |
            TongYun Planner - 橦云手账 v__VERSION__ 发布啦！本产品纯 Vibe coding 产物。

            下载指引：
            - Windows 选 *_x64-setup.exe（推荐）或 .msi
            - macOS 选 *_universal.dmg（Apple Silicon 与 Intel 通用）
            - Linux 选 .AppImage 或 .deb

            已安装 v1.1.0 及以上版本会自动提示更新。v1.0.x 因更新公钥更换，无法应用内升级，请手动下载安装一次。

            ### macOS 首次打开
            说明：安装包没有 Apple 签名和公证，所以 macOS 首次打开会提示「Apple 无法验证 TongyunPlanner…」。三种解决办法：
            1. 系统设置 → 隐私与安全性 → 往下找到提示，点「仍要打开」；
            2. 在「应用程序」里右键点 App，选「打开」，再确认一次；
            3. 终端执行：`xattr -dr com.apple.quarantine /Applications/TongyunPlanner.app`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args || '' }}
          # 仅 tag 发版时写入 latest.json；workflow_dispatch 只构建、不碰 Release
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          updaterJsonPreferNsis: true

      - name: Upload bundle artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: tongyun-planner-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 7
