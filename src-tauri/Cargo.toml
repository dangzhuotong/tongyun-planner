[package]
name = "tongyun-planner"
version = "1.1.0"
description = "橦云手帐：本地优先的 AI 手帐式桌面效率 App"
authors = ["TongYun Planner contributors"]
edition = "2021"

[lib]
name = "tongyun_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
base64 = "0.22"
tauri-plugin-updater = "2.13.0"
tauri-plugin-process = "2.4.0"

