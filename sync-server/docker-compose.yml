services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tongyun_sync}
      MYSQL_USER: ${MYSQL_USER:-tongyun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      # Bind to localhost only — do not publish MySQL to the public internet
      - "127.0.0.1:3306:3306"
    volumes:
      - tongyun_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  sync-api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-tongyun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tongyun_sync}
      API_KEY: ${API_KEY:-replace-with-a-long-random-secret}
      USER_ID: ${USER_ID:-default}
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "8787:8787"

volumes:
  tongyun_mysql_data:
